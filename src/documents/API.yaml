openapi: 3.0.3
info:
  description: |
    This is the specification of the documents API plugin. It is intended to be
    integrated into existing business-apis.
  version: 1.0.0-draft
  title: Documents API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    email: openwealth@synpulse.com
servers:
  - description: Your Server URL.
    url: https://example.org
externalDocs:
  description: Find out more about OpenWealth API specifications.
  url: https://openwealth.ch
