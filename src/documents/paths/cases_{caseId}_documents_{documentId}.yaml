get:
  operationId: getDocument
  summary: Get the Metadata of a Document
  description: Returns the metadata of a specific document of a case.
  parameters:
    - $ref: ../../generics/components/parameters/path_caseId.yaml
    - $ref: ../../generics/components/parameters/path_documentId.yaml
    - $ref: ../../generics/components/parameters/correlation_id.yaml
  tags:
    - documents
  responses:
    '200':
      description: Got the document corresponding to the id.
      headers:
        Correlation-Id:
          $ref: ../../generics/components/headers/Correlation-Id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Document.yaml
          examples:
            PDFStatement:
              $ref: ../components/examples/PdfStatement.yaml
    '400':
      $ref: ../../generics/components/responses/400.yaml
    '401':
      $ref: ../../generics/components/responses/401.yaml
    '403':
      $ref: ../../generics/components/responses/403.yaml
    '404':
      $ref: ../../generics/components/responses/404.yaml
    '405':
      $ref: ../../generics/components/responses/405.yaml
    '500':
      $ref: ../../generics/components/responses/500.yaml
    '501':
      $ref: ../../generics/components/responses/501.yaml
    '503':
      $ref: ../../generics/components/responses/503.yaml
put:
  operationId: updateDocument
  summary: Update the metadata of a document
  description: |
    Replaces the metadata of a document. The complete metadata must be sent; properties that are omitted
    are removed. Documents can only be changed while the case is in status `draft` or `actionRequired`;
    otherwise `409` is returned.
  parameters:
    - $ref: ../../generics/components/parameters/path_caseId.yaml
    - $ref: ../../generics/components/parameters/path_documentId.yaml
    - $ref: ../../generics/components/parameters/correlation_id.yaml
  tags:
    - documents
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Document.yaml
        examples:
          PDFStatement:
            $ref: ../components/examples/PdfStatement.yaml
  responses:
    '200':
      description: Document metadata successfully updated.
      headers:
        Correlation-Id:
          $ref: ../../generics/components/headers/Correlation-Id.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Document.yaml
          examples:
            PDFStatement:
              $ref: ../components/examples/PdfStatement.yaml
    '400':
      $ref: ../../generics/components/responses/400.yaml
    '401':
      $ref: ../../generics/components/responses/401.yaml
    '403':
      $ref: ../../generics/components/responses/403.yaml
    '404':
      $ref: ../../generics/components/responses/404.yaml
    '405':
      $ref: ../../generics/components/responses/405.yaml
    '409':
      $ref: ../../generics/components/responses/409.yaml
    '500':
      $ref: ../../generics/components/responses/500.yaml
    '501':
      $ref: ../../generics/components/responses/501.yaml
    '503':
      $ref: ../../generics/components/responses/503.yaml
