type: object
description: |
  Schema of an execution allocation.
  An execution allocation is the part of the executed quantity that is allocated and booked
  to the client of the parent allocation leg. It is the unit of settlement and booking, and
  carries its own transaction, booking date, value date and billing details.
  It is not a single market execution: market executions are provided as separate Execution
  entities and referenced through executionIds.
  One execution allocation can combine several market executions, for example all partial
  executions of a trading day that are settled together. One market execution can contribute
  to the execution allocations of several clients in a bulk order.
  If an order is executed over several days, the allocation leg holds one execution allocation
  per settlement, e.g. one per trading day. How executions are grouped into execution
  allocations is up to the confirming party.
properties:
  quantity:
    description: |
      Executed quantity allocated to the given client with this execution allocation.
      The unit type of this field is defined by the quantityType property of the allocation leg.
    type: number
    example: 500
  price:
    description: |
      The price for the executed and allocated quantity.
      If several market executions are combined, this is their average price weighted by quantity.
    type: number
    example: 157.50
  priceType:
    $ref: PriceType.yaml
  executionIds:
    type: array
    description: List of market executions, that contributed to the allocated quantity.
    items:
      type: string
      description: Unambiguous identifier for the execution.
      maxLength: 128
      example: 2f66d2c4-9575-4e16-a9ea-7eec3c7e382a
  billingDetails:
    description: |
      Amounts, fees and taxes charged for the quantity booked with this execution allocation.
      When several market executions are settled together (e.g. per trading day),
      fees are calculated once for the combined quantity.
    $ref: BillingDetails.yaml
  transactionId:
    type: string
    description: Indicates the transaction identification for an allocated execution.
    maxLength: 128
    example: e3d556d9-3c88-4807-a1a4-6bc3b31e6c6b
  bookingDate:
    description: Indicates the booking date for an allocated execution of the order.
    $ref: ../../../generics/components/schemas/Date.yaml
  valueDate:
    description: |
      Date when calculating economic benefit for a cash amount of an allocated execution of the order,
      if applicable.
    $ref: ../../../generics/components/schemas/Date.yaml
