type: object
description: |
  Represents a case (process) in the customer lifecycle management, such as mandate opening, address change,
  account closure, or any other structured workflow. A case tracks the type, status, and type-specific content
  of a lifecycle process.
required:
  - type
properties:
  id:
    type: string
    description:
      Unique and unambiguous identification (i.e. UUID) used by the bank
      for the case.
    maxLength: 128
    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    readOnly: true
  type:
    type: string
    description: Indicates the type of lifecycle process this case represents.
    enum:
      - addCustomer
      - addPerson
      - addMandate
      - addPowerOfAttorney
      - addCorrespondence
      - modifyObject
      - removeObject
      - other
    example: addMandate
  typeOverride:
    type: string
    description:
      Indicates the specific case type. Attribute shall only be used if
      the case type is not already part of the ENUM of the attribute "type"
      hence in exceptional cases (in case of type "other").
    maxLength: 70
    example: customProcess
  status:
    type: string
    description: Indicates the current status of the case in its lifecycle.
    enum:
      - draft
      - open
      - inProgress
      - pendingApproval
      - approved
      - rejected
      - completed
      - cancelled
    example: open
    readOnly: true
  title:
    type: string
    description: A short descriptive title for the case.
    maxLength: 140
    example: Mandate Opening for Client Stark
  description:
    type: string
    description: A detailed description providing additional context for the case.
    maxLength: 500
    example: Opening a new discretionary mandate for the client.
  dueDate:
    description: Target completion date for the case.
    $ref: '../../../generics/components/schemas/Date.yaml'
  createdDateTime:
    description: Date when the case was created.
    $ref: '../../../generics/components/schemas/DateTime.yaml'
  updatedDateTime:
    description: Date when the case was updated.
    $ref: '../../../generics/components/schemas/DateTime.yaml'
  completedDateTime:
    description: Date when the case was completed or closed.
    $ref: '../../../generics/components/schemas/DateTime.yaml'
  content:
    oneOf:
      - $ref: './Customer.yaml'
      - $ref: './Person.yaml'
      - $ref: './Mandate.yaml'
      - $ref: './PowerOfAttorney.yaml'
      - $ref: './Correspondence.yaml'
      - $ref: './ModifyContent.yaml'
      - $ref: './RemoveContent.yaml'
      - $ref: './OtherContent.yaml'
    description: |
      Type-specific content of the case. The structure of this object depends on the case type
      and allows for flexible, type-specific data to be attached to the case. The content schema
      used for a specific case is determined by the case type and the operation performed (add,
      modify, remove).
  statusReasonList:
    type: array
    description:
      List of reasons explaining the current status of the case, such as
      errors or missing information.
    items:
      $ref: './StatusReason.yaml'
    readOnly: true
  outputList:
    type: array
    description: |
      Resources created or modified as a result of processing this case.
      Populated by the bank as the case progresses.
      This also includes documents handled by the bank as part of the case
      processing, and associated to a different resource than the case itself.
    readOnly: true
    items:
      $ref: './RelatedResource.yaml'
  documentList:
    type: array
    description: List of documents associated with this case added by the API consumer (EAM).
    items:
      $ref: './Document.yaml'
