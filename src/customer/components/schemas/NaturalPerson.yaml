type: object
allOf:
  - $ref: 'PersonBase.yaml'
required:
  - givenName
  - lastName
  - nationalityList
  - dateOfBirth
properties:
  givenName:
    type: string
    description: |
      Given name of the person. The primary name according to the passport should be indicated in that
      field and no abbreviations/common names (Dan instead of Daniel etc.) used.
    maxLength: 35
    example: Anthony
  middleName:
    type: string
    description: |
      Middle name of the person. The middle name according to the passport should be indicated in that
      field and no abbreviations/common names (Dan instead of Daniel etc.) used.
    maxLength: 35
    example: Edward
  lastName:
    type: string
    description: |
      Last name(s) of the person. The last name(s) according to the passport should be indicated in
      that field (hyphenated and spaced names as well).
    maxLength: 35
    example: Stark
  title:
    type: string
    description: Official title of the person.
    maxLength: 35
    example: PhD
  dateOfBirth:
    $ref: '../../../generics/components/schemas/Date.yaml'
  dateOfMarriage:
    $ref: '../../../generics/components/schemas/Date.yaml'
  dateOfDeath:
    $ref: '../../../generics/components/schemas/Date.yaml'
  gender:
    type: string
    description: Gender of the person
    enum:
      - male
      - female
      - divers
    example: male
  nationalityList:
    type: array
    description: |
      Country/Countries where a person was born or is legally accepted as belonging to the country.
      The first country in the list represents the main nationality.
    items:
      $ref: 'Country.yaml'
  civilStatus:
    type: string
    description: Civil status of the person.
    enum:
      - divorced
      - legallyDivorced
      - married
      - separated
      - single
      - stableUnion
      - widow
    example: married
  placeOfBirth:
    $ref: 'Country.yaml'
  income:
    $ref: 'Income.yaml'
  wealth:
    $ref: 'Wealth.yaml'
  employment:
    $ref: 'Employment.yaml'
  education:
    $ref: 'Education.yaml'
  isPep:
    type: boolean
    description: Denotes if this person is a publically exposed person (PEP).
    example: false
  isFatca:
    type: boolean
    description: Denotes if this person is subject to the US Foreign Account Tax Compliance Act (FATCA).
    example: false
