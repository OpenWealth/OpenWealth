type: object
description: Provides information about the employment status and the employment itself (e.g. company)
required:
  - status
properties:
  status:
    type: string
    description: Status of employment
    enum:
      - employed
      - selfEmployed
      - retired
      - student
      - unemployed
      - firmOwner
      - privateEquityInvestor
      - professionalInvestor
      - other
    example: retired
  profession:
    type: string
    description: Profession
    maxLength: 35
    example: Economist
  yearOfRetirement:
    type: string
    pattern: '[0-9]{4}'
    description: Year of retirement (if applicable).
    example: '1995'
  employmentItemList:
    type: array
    description: List of employments of the person.
    items:
      $ref: 'EmploymentItem.yaml'
