type: object
required:
  - type
  - amount
properties:
  type:
    type: string
    description: Type of account movement, either inflow or outflow of assets.
    enum:
      - inflow
      - outflow
    example: inflow
  amount:
    $ref: 'Amount.yaml'
  dateReceivedOrSent:
    $ref: '../../../generics/components/schemas/Date.yaml'
  counterparty:
    type: string
    description: Name of the sender/receiver of the assets.
    maxLength: 70
    example: Muster AG
  purpose:
    type: string
    description: Purpose for the transfer.
    maxLength: 128
    example: Monthly salary payment
  frequency:
    type: string
    description: Frequency of payment/transfer.
    example: monthly
    enum:
      - oneTime
      - daily
      - weekly
      - biweekly
      - semimonthly
      - monthly
      - quarterly
      - semiannually
      - annually
      - other
  countryOfOrigin:
    type: string
    description: Country of origin of the fund flow, in ISO 3166-1 alpha-2 format.
    pattern: '^[A-Z]{2}$'
    example: US
  accountOfOrigin:
    type: string
    description: |
      Account number of the sender/receiver of the assets, in IBAN format
      where applicable.
    maxLength: 34
    example: DE89370400440532013000
  nameOfBank:
    type: string
    description: Name of the bank of the counterparty.
    maxLength: 128
  domicileOfBank:
    description: Domicile of the bank of the counterparty
    $ref: 'Country.yaml'
  additionalInformation:
    type: string
    description: Free text field to provide additional information.
    maxLength: 2048
    example: This is additional information.
