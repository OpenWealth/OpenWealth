type: object
required:
  - name
  - type
  - mainAdress
properties:
  id:
    type: string
    description:
      Unique and unambiguous identification (i.e. UUID) used by the bank
      for the customer.
    maxLength: 128
    example: 3f1c6a3e-9b7e-4f8b-a7c9-1d2e4a8c6b5f
    readOnly: true
  number:
    type: string
    description: Contains the customers custody proprietary customer number if available.
    maxLength: 70
    example: 12345-6
    readOnly: true
  name:
    type: string
    description: Name of the customer.
    maxLength: 140
  type:
    type: string
    description: Type of customer relationship
    enum:
      - individual
      - groupOfIndividuals
      - legalEntity
      - foundation
      - insuranceCompany
      - institutionalInvestor
      - bank
      - other
    example: individual
  mainAdress:
    description: Main address of the customer for correspondence purposes.
    $ref: Address.yaml
  status:
    type: string
    description: Status of the customer relationship
    enum:
      - active
      - inactive
    example: active
    readOnly: true
  referenceCurrency:
    $ref: '../../../generics/components/schemas/Currency.yaml'
  openingDate:
    $ref: '../../../generics/components/schemas/Date.yaml'
  salutation:
    $ref: Salutation.yaml
  salutationOverride:
    type: string
    description: |
      Field to indicate the salutation override.
      Should only be used when salutation enum value is 'other' and 
      the salutation value is not sufficient to address the customer.
    maxLength: 128
    example: Your Highness
  language:
    description: Preferred language of the customer.
    $ref: Language.yaml
  personToCustomerRelationList:
    type: array
    description: List of relations between the customer and persons.
    items:
      $ref: PersonToCustomerRelation.yaml
  bankAdvisor:
    description:
      Indicates the instruction/full name of the bank advisor on the side
      of the custody bank.
    $ref: Contact.yaml
