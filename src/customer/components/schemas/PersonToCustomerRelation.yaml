type: object
description: |
  Relation of a person to the customer relationship: their position in the contract with the bank and/or
  their beneficial ownership of the assets. At least one of `contractualRole` and `beneficialRole` must be
  provided. Voluntary authority (power of attorney) is not a relation to the customer; it is granted on the
  mandate.
anyOf:
  - required:
      - contractualRole
  - required:
      - beneficialRole
properties:
  id:
    type: string
    description: Unique and unambiguous identification (i.e. UUID) used by the bank for the relation.
    maxLength: 128
    example: 6c4e1b92-5f7a-4d3c-8e9b-2a1f6d7c0e54
    readOnly: true
  customerId:
    type: string
    description: Unique and unambiguous identification used by the bank for the customer.
    maxLength: 128
    example: 3f1c6a3e-9b7e-4f8b-a7c9-1d2e4a8c6b5f
    readOnly: true
  personId:
    type: string
    description: Unique and unambiguous identification used by the bank for the person.
    maxLength: 128
    example: c7a0f4d3-5b28-4e91-9f44-8a1c2e7b33aa
    readOnly: true
  person:
    $ref: Person.yaml
  contractualRole:
    type: string
    description: |
      Position of the person in the contract with the bank.
        * `contractingPartner` - Holder of the customer relationship. Joint holders each have their own entry.
        * `statutoryRepresentative` - Represents a holder who lacks legal capacity, by law or by decision of
          an authority (parental authority, guardianship, executorship).
        * `authorisedSignatory` - Represents a holder that is a legal entity, through its governing body or a
          signatory registered in the commercial register.
        * `other` - Any other contractual position.
    enum:
      - contractingPartner
      - statutoryRepresentative
      - authorisedSignatory
      - other
    example: contractingPartner
  beneficialRole:
    type: string
    description: |
      Beneficial ownership of the assets, as identified under anti-money-laundering due diligence.
        * `beneficialOwner` - Natural person economically entitled to the assets.
        * `controllingPerson` - Controls an operating legal entity (25% or more of capital or votes, or otherwise).
        * `settlor` - Settlor of a trust or founder of a foundation.
        * `trustee` - Trustee of a trust or member of the foundation board.
        * `protector` - Protector of a trust or foundation.
        * `beneficiary` - Beneficiary of a trust or foundation.
        * `other` - Any other beneficial role.
    enum:
      - beneficialOwner
      - controllingPerson
      - settlor
      - trustee
      - protector
      - beneficiary
      - other
    example: beneficialOwner
  ownershipPercentage:
    type: number
    description: Share of capital or votes held by the person in percent. Only used for `controllingPerson`.
    minimum: 0
    maximum: 100
    example: 60
  signatoryRight:
    $ref: SignatoryRight.yaml
