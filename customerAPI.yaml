openapi: 3.0.0
info:
  version: 3.0.0-draft
  title: Customer API
  description: |
    This API is part of the OpenWealth APIs for the connectivity between custody banks and WealthTechs (e.g. Portfolio Management Systems
    and CRMs). It facilitates the connection of CRMs to custody banks to automate customer onboarding and lifecycle management (Static Data
    KYC & Documents). It enables the user to create, modify and consume customer data at/from custody banks.
    This version of the API is focused solely on natural persons. The management of companies, complex structures as well as products is
    currently not part of the scope of this API version.
  contact:
    email: openwealth@synpulse.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - description: Your Server URL.
    url: https://api.openwealth.ch
security: []
tags:
  - name: cases
    description: Operations for managing cases in the customer lifecycle.
  - name: customers
    description: Operations for managing customers.
  - name: persons
    description: Operations for managing persons.
  - name: mandates
    description: Operations for managing mandates of a customer.
  - name: powerOfAttorneys
    description: Operations for managing powers of attorney of a mandate.
  - name: correspondence
    description: Operations for managing correspondence of a mandate.
  - name: documents
    description: Operations for managing documents of a case.
externalDocs:
  description: Find out more about OpenWealth API specifications.
  url: https://openwealth.ch
paths:
  /cases:
    get:
      tags:
        - cases
      summary: Returns the cases
      description: |
        Returns all cases accessible to the querying user.
        Paging is done based on the case object, i.e. if limit is set to 1,
        then 1 case will be returned per page.
      operationId: getCases
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Cases List.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
            Next-Cursor:
              $ref: '#/components/headers/Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    post:
      tags:
        - cases
      summary: Creates a new case
      description: Creates a new case (lifecycle process).
      operationId: createCase
      parameters:
        - $ref: '#/components/parameters/correlation_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Case'
      responses:
        '201':
          description: Case successfully created.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /cases/{caseId}:
    get:
      tags:
        - cases
      summary: Returns a case by id
      description: Returns a specific case by id.
      operationId: getCaseById
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Case.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    put:
      tags:
        - cases
      summary: Updates a case by id
      description: |
        Updates an existing case by id. A case can only be updated while it is in status `draft` or
        `actionRequired`; otherwise `409` is returned. The case `type` cannot be changed after creation.
      operationId: updateCaseById
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/correlation_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Case'
      responses:
        '200':
          description: Case successfully updated.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /cases/{caseId}/actions/{action}:
    post:
      tags:
        - cases
      summary: Action on a specific case
      description: |
        Places an action request for a specific case. The allowed actions depend on the status of the case;
        an action that is not allowed in the current status returns `409`.
          * `submit` - Allowed in `draft` and `actionRequired`. Moves the case to `submitted`.
          * `cancel` - Allowed in `submitted` and `actionRequired`, where the case moves to `cancelled`.
            In `inProgress` and `pendingApproval` the cancellation is a request that the bank may accept
            (case moves to `cancelled`) or decline (status is unchanged, reason in `statusReasonList`).
      operationId: actionOnCase
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/action'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '202':
          description: Action confirmed for the given case.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /cases/{caseId}/documents:
    get:
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation_id'
      summary: Get the List of Documents
      description: |
        Get a list of all documents related to a case.
        Paging is done based on the document object, i.e. if limit is set to 1,
        then 1 document will be returned per page.
      operationId: getDocuments
      tags:
        - documents
      responses:
        '200':
          description: Returns a list with all document metadata records.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
            Next-Cursor:
              $ref: '#/components/headers/Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    post:
      summary: Add a New Document
      description: |
        Upload the metadata for a new file. Documents can only be added while the case is in status
        `draft` or `actionRequired`; otherwise `409` is returned.
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/correlation_id'
      operationId: addDocument
      tags:
        - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        '201':
          description: Document was accepted.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /cases/{caseId}/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Get the Metadata of a Document
      description: Returns the metadata of a specific document of a case.
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/path_documentId'
        - $ref: '#/components/parameters/correlation_id'
      tags:
        - documents
      responses:
        '200':
          description: Got the document corresponding to the id.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    put:
      operationId: updateDocument
      summary: Update the metadata of a document
      description: |
        Replaces the metadata of a document. The complete metadata must be sent; properties that are omitted
        are removed. Documents can only be changed while the case is in status `draft` or `actionRequired`;
        otherwise `409` is returned.
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/path_documentId'
        - $ref: '#/components/parameters/correlation_id'
      tags:
        - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        '200':
          description: Document metadata successfully updated.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /cases/{caseId}/documents/{documentId}/content:
    put:
      summary: Upload binary document content
      description: |
        Uploads the binary content of a document. Existing content is replaced. Content can only be uploaded
        while the case is in status `draft` or `actionRequired`; otherwise `409` is returned.
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/path_documentId'
        - $ref: '#/components/parameters/correlation_id'
      operationId: uploadDocumentContent
      tags:
        - documents
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Successful upload of the document content (empty response).
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    get:
      operationId: getDocumentContent
      summary: Download Document Content
      description: Returns the binary content of a specific document of a case.
      parameters:
        - $ref: '#/components/parameters/path_caseId'
        - $ref: '#/components/parameters/path_documentId'
        - $ref: '#/components/parameters/correlation_id'
      tags:
        - documents
      responses:
        '200':
          description: Get document content corresponding to the id.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers:
    get:
      tags:
        - customers
      summary: Returns all customers (business partners) accessible for the logged in user
      description: |
        This endpoint returns a highlevel list of customers accessible for the
        logged in user. Paging is done based on the customer object,
        i.e. if limit is set to 1, then 1 customer will be returned per page.
      operationId: getCustomers
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Returns a list with all customers.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
            Next-Cursor:
              $ref: '#/components/headers/Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers/{customerId}:
    get:
      tags:
        - customers
      summary: Returns a specific customer by id
      description: Returns a specific customer by id accessible for the requesting user.
      operationId: getCustomersByCustomerId
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Returns a the specified customer.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers/{customerId}/mandates:
    get:
      tags:
        - mandates
      summary: Returns the mandates for a specific customer
      description: |
        Returns all mandates for a specific customer accessible to the querying user.
        Paging is done based on the mandate object, i.e. if limit is set to 1,
        then 1 mandate will be returned per page.
      operationId: getMandatesByCustomerId
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Mandates List.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
            Next-Cursor:
              $ref: '#/components/headers/Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mandate'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers/{customerId}/mandates/{mandateId}:
    get:
      tags:
        - mandates
      summary: Returns a mandate by id
      description: Returns a mandate by id for a specific customer.
      operationId: getMandateById
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/path_mandateId'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Mandate.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers/{customerId}/mandates/{mandateId}/power-of-attorneys:
    get:
      tags:
        - powerOfAttorneys
      summary: Returns the powers of attorney for a specific mandate
      description: |
        Returns all powers of attorney associated with a specific mandate accessible to the querying user.
        Paging is done based on the power of attorney object, i.e. if limit is set to 1,
        then 1 power of attorney will be returned per page.
      operationId: getPowerOfAttorneysByMandateId
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/path_mandateId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Powers of Attorney List.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
            Next-Cursor:
              $ref: '#/components/headers/Next-Cursor'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerOfAttorney'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    post:
      tags:
        - powerOfAttorneys
      summary: Creates a new power of attorney for a specific mandate
      description: Creates a new power of attorney associated with a specific mandate.
      operationId: createPowerOfAttorneyByMandateId
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/path_mandateId'
        - $ref: '#/components/parameters/correlation_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerOfAttorney'
      responses:
        '201':
          description: Power of Attorney successfully created.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerOfAttorney'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
  /customers/{customerId}/mandates/{mandateId}/power-of-attorneys/{powerOfAttorneyId}:
    get:
      tags:
        - powerOfAttorneys
      summary: Returns a power of attorney by id
      description: Returns a specific power of attorney by id for a specific mandate.
      operationId: getPowerOfAttorneyById
      parameters:
        - $ref: '#/components/parameters/path_customerId'
        - $ref: '#/components/parameters/path_mandateId'
        - $ref: '#/components/parameters/path_powerOfAttorneyId'
        - $ref: '#/components/parameters/correlation_id'
      responses:
        '200':
          description: Power of Attorney.
          headers:
            Correlation-Id:
              $ref: '#/components/headers/Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerOfAttorney'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    put:
      tags:
